<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Samuel </title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 30%, rgba(90,0,120,0.4), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,60,120,0.4), transparent 40%),
        radial-gradient(circle at center, #000814 0%, #00040a 60%, #000 100%);
    font-family:'Playfair Display', serif;
    color:white;
}

.universo{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

/* ESTRELLAS FONDO */
.estrella{
    position:absolute;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation: parpadear 3s infinite alternate;
}

@keyframes parpadear{
    from{opacity:.3;}
    to{opacity:1;}
}

/* LUNA REALISTA */
.luna{
    position:absolute;
    top:5%;
    right:5%;
    width:170px;
    height:170px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%, #ffffff 5%, #e0e0e0 30%, #bfbfbf 60%, #8c8c8c 100%);
    box-shadow:
        0 0 80px rgba(255,255,255,0.5),
        inset -25px -25px 40px rgba(0,0,0,0.5);
    transition:2s ease;
}

/* TEXTO */
.contenido{
    max-width:820px;
    z-index:10;
}

.contenido p{
    font-size:18px;
    line-height:1.5;
    margin-bottom:8px;
    opacity:0;
    transition:1.5s;
}

.firma{
    margin-top:15px;
    font-family:'Great Vibes', cursive;
    font-size:36px;
    opacity:0;
    transition:2s;
}

button{
    position:absolute;
    padding:12px 26px;
    font-size:16px;
    border:none;
    border-radius:30px;
    background:white;
    color:black;
    cursor:pointer;
    z-index:20;
}
</style>
</head>

<body>

<div class="universo">
<div class="luna"></div>
<button id="abrirBtn">.....</button>
<div class="contenido" id="contenido"></div>
<div class="firma" id="firma">Con amor, Nori</div>
</div>

<script>

const universo=document.querySelector(".universo");
const boton=document.getElementById("abrirBtn");
const contenido=document.getElementById("contenido");
const firma=document.getElementById("firma");
const luna=document.querySelector(".luna");

/* ESTRELLAS DE FONDO */
for(let i=0;i<200;i++){
    let estrella=document.createElement("div");
    estrella.className="estrella";
    let size=Math.random()*2+1;
    estrella.style.width=size+"px";
    estrella.style.height=size+"px";
    estrella.style.top=Math.random()*100+"%";
    estrella.style.left=Math.random()*100+"%";
    universo.appendChild(estrella);
}

/* 🎬 FORMAR TE AMO - MODO PELÍCULA */
function formarNombre(){

    const luna=document.querySelector(".luna");
    const lunaSize=luna.offsetWidth;

    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d");

    /* 🔹 MÁS PEQUEÑO (similar a la luna) */
    canvas.width=lunaSize*2.2;
    canvas.height=lunaSize*1.4;

    ctx.fillStyle="white";
    ctx.font="bold "+(lunaSize*0.55)+"px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("TE AMO",canvas.width/2,canvas.height/2);

    const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;

    let puntos=[];

    /* 🔹 Más precisión para que la O no se corte */
    for(let y=0;y<canvas.height;y+=3){
        for(let x=0;x<canvas.width;x+=3){
            let index=(y*canvas.width+x)*4;
            if(data[index+3]>120){
                puntos.push({x,y});
            }
        }
    }

    let estrellasTexto=[];

    /* 🌌 ESTRELLAS DISPERSAS POR TODA LA PANTALLA */
    puntos.forEach(()=>{
        let estrella=document.createElement("div");
        estrella.className="estrella";

        estrella.style.width="2px";
        estrella.style.height="2px";

        /* Ahora se dispersan en TODO el universo */
        estrella.style.left=Math.random()*window.innerWidth+"px";
        estrella.style.top=Math.random()*window.innerHeight+"px";

        estrella.style.opacity="0.4";
        universo.appendChild(estrella);
        estrellasTexto.push(estrella);
    });

    /* 🎬 Pausa cinematográfica */
    setTimeout(()=>{

        estrellasTexto.forEach((estrella,i)=>{
            setTimeout(()=>{

                estrella.style.transition="3s cubic-bezier(.4,0,.2,1)";

                /* Posición esquina superior izquierda */
                estrella.style.left=(puntos[i].x+50)+"px";
                estrella.style.top=(puntos[i].y+10)+"px";

                estrella.style.width="4px";
                estrella.style.height="4px";
                estrella.style.boxShadow="0 0 20px white";
                estrella.style.opacity="1";

            },i*6);
        });

    },2500);
}


/* TEXTO */
const mensaje=[
"Samuel,",
"Sé lo mucho que amas las noches estrelladas.",
"Sé cuánto admiras la luna cuando ilumina el cielo en silencio.",
"Por eso hoy te regalo esta galaxia, llena completamente de mis sentimientos por ti.",
"Quiero que sepas cuánto te amo, cuánto te valoro y lo agradecido que estoy por tenerte en mi vida.",
"Gracias por soportarme en mis días difíciles.",
"Perdóname por las noches complicadas y por los momentos en los que te has sentido solo.",
"No puedo cambiar el pasado, pero sí puedo prometerte que mejoraré, que cuidaré tu corazón y que haré todo lo posible para que te sientas tranquilo y amado.",
"Esta es mi forma de abrir mi corazón ante ti.",
"Mi manera de decirte que eres el mejor, mi persona especial y que mi amor por ti es tan infinito como este universo.",
"Te amo más de lo que las palabras pueden explicar."
];

function mostrarTexto(){
    mensaje.forEach((parrafo,index)=>{
        let p=document.createElement("p");
        p.textContent=parrafo;
        contenido.appendChild(p);
        setTimeout(()=>{p.style.opacity=1;},index*500);
    });

    setTimeout(()=>{firma.style.opacity=1;},mensaje.length*500+1000);
}

boton.addEventListener("click",()=>{
    boton.style.display="none";
    formarNombre();
    setTimeout(mostrarTexto,4500);
});

</script>
</body>
</html>
